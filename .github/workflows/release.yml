name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run web:build
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis
        working-directory: clipper
      - name: Publicar instalador
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" clipper/src-tauri/target/release/bundle/nsis/*.exe --title "$GITHUB_REF_NAME" --generate-notes
