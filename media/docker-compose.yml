services:
  shrt-media:
    build: .
    container_name: shrt-media
    restart: unless-stopped
    env_file: .env
    user: "${MEDIA_UID:-1000}:${MEDIA_GID:-1000}"
    volumes:
      - ./data:/data
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  shrt-media-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: shrt-media-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?}
    depends_on:
      - shrt-media
    mem_limit: 128m
    cpus: 0.25
